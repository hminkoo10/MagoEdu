# 서버 Docker 이미지 (ghcr.io/hminkoo10/magoedu-cloud) — 필요할 때만 손으로 실행
#   Actions → Server image → Run workflow
#   (서버는 systemd 로 돌리고 Deploy (서버) 워크플로가 자동 배포하므로, 이 이미지는 Docker 로 돌릴 때만 필요해요)
#   처음 올릴 때 "denied" 가 나오면: GitHub → 내 프로필 → Packages → magoedu-cloud → Package settings 에서
#   MagoEdu 저장소에 Write 권한(Manage Actions access)을 주세요.
name: Server image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 서버 시험
        working-directory: server
        run: npm test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 만들기
        run: |
          v="$(node -p "require('./server/package.json').version")"
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/magoedu-cloud"
          docker build -t "$img:latest" -t "$img:$v" server
          docker push "$img:latest"
          docker push "$img:$v"
