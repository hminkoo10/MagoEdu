# 서버 Docker 이미지 (ghcr.io/hminkoo10/magoedu-cloud)
#   server/ 가 바뀌어 main 에 올라오면 이미지를 만들어 GitHub Packages 에 올려요.
name: Server image

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/docker-server.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 서버 시험
        working-directory: server
        run: npm test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 이미지 만들기
        run: |
          v="$(node -p "require('./server/package.json').version")"
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/magoedu-cloud"
          docker build -t "$img:latest" -t "$img:$v" server
          docker push "$img:latest"
          docker push "$img:$v"
