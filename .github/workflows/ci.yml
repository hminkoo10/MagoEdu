name: CI

# main 과 PR 에서만 (같은 커밋을 브랜치 push 와 PR 로 두 번 돌리지 않게).
# 설치 파일 빌드는 main 에서 Release 워크플로가 함.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: 서버 시험
        working-directory: server
        run: npm test

      - name: 연결 도구(SDK) 시험
        working-directory: sdk
        run: npm test

      - name: 통합 클라우드 프로그램 시험
        working-directory: launcher
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm test
